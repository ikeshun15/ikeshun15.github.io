<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Game — Shun15</title>
    <meta name="robots" content="noindex" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f3f3f1;
        --ink: #111;
        --ink-3: #8e8e8b;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0b0b0b;
          --ink: #ececea;
          --ink-3: #6c6c69;
        }
      }
      body {
        margin: 0;
        min-height: 100svh;
        display: grid;
        place-items: center;
        gap: 16px;
        padding: 24px 16px;
        box-sizing: border-box;
        background: var(--bg);
        color: var(--ink);
        font: 11px/1.5 ui-monospace, 'SFMono-Regular', monospace;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
      iframe {
        display: block;
        width: min(400px, 100%);
        aspect-ratio: 4 / 5;
        border: 0;
      }
      a {
        color: var(--ink-3);
        text-decoration: none;
      }
      a:hover {
        color: var(--ink);
      }
    </style>
  </head>
  <body>
    <iframe src="/game/game.html" title="Game" scrolling="no"></iframe>
    <a href="/">← Shun15</a>
  </body>
</html>
