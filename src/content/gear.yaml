# Gear（道具）：いま使っているものだけを書く。ここに書いた順に並ぶ
#
#   category  … 種類（例: カメラ / スマートフォン）
#   name      … 名前（日英で同じなら文字だけ、違うなら { ja: …, en: … }）
#   model     … 型番・別名（なくてもよい。書き方は name と同じ）
#   href      … 公式サイトなどへのリンク（なくてもよい。日英で分けるなら { ja: …, en: … }）
#   sponsored … アフィリエイトなど広告のリンクなら true（セクションの下に広告の表記が出る）
#
# ひとつもないときは、Gear のセクションとメニューの項目が自動で消える

- category: { ja: スマートフォン, en: Phone }
  name: Google Pixel 10 Pro
  href:
    ja: https://store.google.com/jp/product/pixel_10_pro?hl=ja
    en: https://store.google.com/product/pixel_10_pro

- category: { ja: スマートフォン, en: Phone }
  name: Google Pixel 10 Pro Fold
  href:
    ja: https://store.google.com/jp/product/pixel_10_pro_fold?hl=ja
    en: https://store.google.com/product/pixel_10_pro_fold

