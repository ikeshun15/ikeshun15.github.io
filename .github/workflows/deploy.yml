name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # バージョンは package.json の packageManager から読む
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # 変換済み画像のキャッシュ。写真が増えてもビルド時間を抑える
      - uses: actions/cache@v6
        with:
          path: node_modules/.astro
          key: astro-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('src/photos/**') }}
          restore-keys: |
            astro-${{ hashFiles('pnpm-lock.yaml') }}-

      # build には GPS チェック（scripts/check-exif.mjs）も含まれる
      - run: pnpm build

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
